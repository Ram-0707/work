<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 작업량 관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6bff'/%3E%3Cpath d='M7.4 24.6l1.7-5.1L19.9 8.7a2.4 2.4 0 0 1 3.4 3.4L12.5 22.9l-5.1 1.7z' fill='%23fff'/%3E%3Cpath d='M18.4 10.2l3.4 3.4M9.1 19.5l3.4 3.4' stroke='%232f6bff' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="logo">웹툰 작업량 관리</div>
      <div class="sub">컷 단위 분배 · 진행 추적</div>
    </div>
    <div class="sb-body">
      <div class="sb-label">
        <span>프로젝트</span>
        <div class="sortbar" id="sortBar">
          <button data-sort="added" title="등록한 순서">등록</button>
          <button data-sort="color" title="색상 순서">색상</button>
          <button data-sort="due" title="마감일이 빠른 순서">마감</button>
        </div>
      </div>
      <div id="projects"></div>
    </div>
    <div class="sb-foot">
      <button class="btn primary" id="addProject">+ 새 프로젝트</button>
      <div class="foot-row">
        <button class="btn ghost sm" id="exportBtn">백업 내보내기</button>
        <button class="btn ghost sm" id="importBtn">불러오기</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="nav" id="prevM" aria-label="이전 달">‹</button>
      <div class="month" id="monthLabel"></div>
      <button class="nav" id="nextM" aria-label="다음 달">›</button>
      <button class="btn ghost sm" id="todayBtn">오늘</button>
      <div class="spacer"></div>
      <div class="today-sum" id="todaySum"></div>
    </div>

    <div class="banner" id="banner" hidden>
      <span class="bdot" id="bdot"></span>
      <span id="bannerText"></span>
      <span class="bhint" id="bannerHint"></span>
      <button class="btn primary sm" id="bannerDone">선택 완료</button>
    </div>

    <div class="week-head">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div><div class="wk">체크리스트</div>
    </div>
    <div class="cal-wrap" id="calWrap">
      <div class="cal" id="cal"></div>
    </div>
  </main>
</div>

<!-- 프로젝트 모달 -->
<div class="mask" id="pMask" hidden>
  <div class="modal">
    <div class="m-head"><span id="pTitle">새 프로젝트</span><button class="icon" data-close="pMask">✕</button></div>
    <div class="m-body">
      <label class="field">
        <span>프로젝트 이름</span>
        <input type="text" id="fName" placeholder="예) 회귀한 천재화가 12화">
      </label>
      <label class="field">
        <span>총 작업량 (컷)</span>
        <input type="number" id="fCuts" min="1" step="1" placeholder="50">
      </label>
      <div class="field">
        <span>콘티</span>
        <label class="toggle" for="fStoryboard">
          <input type="checkbox" id="fStoryboard">
          <span class="tg-box"></span>
          <span class="tg-txt"><b>초안 · 클린업 분리 기록</b>
            <small>켜면 총 컷수만큼 초안과 클린업을 각각 따로 기록합니다. (60컷 → 초안 60컷 + 클린업 60컷)</small></span>
        </label>
      </div>
      <div class="field">
        <span>마감일</span>
        <div class="dl"><span id="fDeadlineText">미지정</span><small>캘린더 날짜를 눌러 지정합니다</small></div>
      </div>
      <div class="field">
        <span>색상</span>
        <div class="swatches" id="fColors"></div>
      </div>
      <p class="hint">저장하면 캘린더에서 작업할 날짜를 하루씩 눌러 지정할 수 있어요.</p>
    </div>
    <div class="m-foot">
      <button class="btn danger ghost" id="pDelete">삭제</button>
      <div class="spacer"></div>
      <button class="btn ghost" data-close="pMask">취소</button>
      <button class="btn primary" id="pSave">저장</button>
    </div>
  </div>
</div>

<!-- 날짜 모달 -->
<div class="mask" id="dMask" hidden>
  <div class="modal">
    <div class="m-head"><span id="dTitle"></span><button class="icon" data-close="dMask">✕</button></div>
    <div class="m-body" id="dBody"></div>
    <div class="m-foot">
      <button class="btn ghost" id="dNewDeadline">+ 이 날짜 마감으로 새 프로젝트</button>
      <div class="spacer"></div>
      <button class="btn primary" data-close="dMask">완료</button>
    </div>
  </div>
</div>

<script src="app.js?v=17"></script>
</body>
</html>
